[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-sentiment"
version = "0.1.0"
description = "Analyst revisions, PEAD, and sentiment alpha generation engine for WorldQuant BRAIN."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Xtley001" }]
keywords = [
    "worldquant",
    "brain",
    "alpha",
    "quantitative-finance",
    "sentiment-analysis",
    "earnings-revisions",
    "pead",
    "factor-investing",
    "algorithmic-trading",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "brain-core>=0.1.0",
    "brain-store>=0.1.0",
    "brain-decorrelator>=0.1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black", "flake8", "mypy"]
sim = ["wqb>=0.2.5"]

[project.urls]
Homepage = "https://github.com/Xtley001/brain-libraries"
Repository = "https://github.com/Xtley001/brain-libraries"
Documentation = "https://github.com/Xtley001/brain-libraries"
"Bug Tracker" = "https://github.com/Xtley001/brain-libraries/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain_sentiment*"]

[tool.setuptools.package-data]
brain_sentiment = ["py.typed", "data/*.json", "*.json"]
