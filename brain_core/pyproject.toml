[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-core"
version = "0.1.0"
description = "Core utilities, configuration, shared data-models, and logging for the Brain Alpha Engine."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Xtley001" }]
keywords = [
    "worldquant",
    "brain",
    "alpha",
    "quantitative-finance",
    "algorithmic-trading",
    "factor-investing",
    "data-models",
    "financial-ml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black", "flake8", "mypy"]

[project.urls]
Homepage = "https://github.com/Xtley001/brain-libraries"
Repository = "https://github.com/Xtley001/brain-libraries"
Documentation = "https://github.com/Xtley001/brain-libraries"
"Bug Tracker" = "https://github.com/Xtley001/brain-libraries/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain_core*"]

[tool.setuptools.package-data]
brain_core = ["py.typed"]
